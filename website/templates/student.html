<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    
    <header class="student-header">
        <div class="header-left">
          <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      
        <div class="header-center">
          <img src="{{ url_for('static', filename='chameleon.png') }}" alt="Chameleon Logo" class="student-logo">
        </div>
      
        <div class="header-right">
            <a href="{{ url_for('logout') }}" class="greeting">Hello, {{ name }}</a>
          <img src="{{ url_for('static', filename='bell.png') }}" alt="Bell Icon" class="bell-icon">
        </div>
      </header>
      

      <main class="student-content">
        <div class="schedule-wrapper">
          <h3 class="schedule-title">Semester</h3>
          <div class="schedule-box">
            <p>Your class schedule will appear here.</p>
          </div>
        </div>
      </main>

  <footer class="student-footer">
    © 2025 KAMA University
  </footer>
</body>
</html>
